<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>超嚴謹搜尋器</title>
    <style>
        body { 
            background: #0f0f0f; 
            color: #00ffcc; 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }
        h1 { 
            font-size: 48px; 
            margin-top: 100px;
            margin-bottom: 30px; 
        }
        .search-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            width: 100%;
            max-width: 600px; 
            margin-bottom: 40px;
        }
        input { 
            flex: 1; 
            padding: 16px; 
            font-size: 20px; 
            border-radius: 8px; 
            border: none; 
            outline: none; 
        }
        button { 
            padding: 16px 24px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            background: #00ffcc; 
            color: #0f0f0f; 
            font-weight: bold; 
            white-space: nowrap; 
        }
        button:hover { 
            background: #00cca3; 
        }
        .result-container { 
            width: 100%;
            max-width: 600px; 
            box-sizing: border-box;
            text-align: left; 
            padding: 0 10px;
        }
        pre { 
            font-size: 18px; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-family: Arial, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <h1>超嚴謹搜尋器</h1>
    
    <div class="search-container">
        <input id="q" placeholder="輸入問題...">
        <button onclick="go()">搜尋</button>
    </div>
    
    <div class="result-container">
        <pre id="out"></pre>
    </div>

    <script>
        async function go() {
            var q = document.getElementById("q").value;
            if (!q) { 
                alert("請先輸入問題！"); 
                return; 
            }
            try {
                var res = await fetch("/search?q=" + encodeURIComponent(q));
                var data = await res.json();
                
                var aiSummary = data.summary ? data.summary : "本文字數過多，AI 懶得摘要。";
                
                var txt = "搜尋結果：約 " + data.results + " 筆\n" +
                          "可信度：" + data.credibility + "%\n" +
                          "文字摘要：" + aiSummary + "\n" +
                          "──────────────────────────────────────────────────\n\n" +
                          data.answer;
                          
                document.getElementById("out").innerText = txt;
            } catch (error) {
                document.getElementById("out").innerText = "連線失敗或後端 API 異常。";
            }
        }
    </script>
</body>
</html>
