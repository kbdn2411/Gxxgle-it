<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chaos Search Engine</title>

<style>
body {
    background: #0f0f0f;
    color: #00ffcc;
    font-family: Arial;
    text-align: center;
    padding-top: 80px;
}

input {
    width: 60%;
    padding: 10px;
    font-size: 18px;
}

button {
    padding: 10px 20px;
    margin-left: 10px;
}

pre {
    margin-top: 30px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1> 超嚴謹搜尋器</h1>

<input id="q" placeholder="輸入問題...">
<button onclick="go()">搜尋</button>

<pre id="out"></pre>

<script>
async function go() {
    let q = document.getElementById("q").value;

    let res = await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data = await res.json();

    document.getElementById("out").innerText =
        data.answer;
}
</script>

</body>
</html>
