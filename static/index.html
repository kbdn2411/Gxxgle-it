<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Chaos Search Engine</title>

<style>
body {
    background: #0f0f0f;
    color: #00ff9d;
    font-family: Arial;
    text-align: center;
    padding-top: 80px;
}

input {
    width: 60%;
    padding: 12px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
}

button {
    padding: 12px 20px;
    margin-left: 10px;
    font-size: 16px;
    cursor: pointer;
}

#result {
    margin-top: 40px;
    font-size: 20px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>🔍 Chaos Search Engine</h1>

<input id="q" placeholder="輸入問題...">
<button onclick="search()">搜尋</button>

<div id="result"></div>

<script>
async function search() {
    let q = document.getElementById("q").value;

    let res = await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data = await res.json();

    document.getElementById("result").innerText =
        "模式: " + data.mode + "\n\n" + data.answer;
}
</script>

</body>
</html>
