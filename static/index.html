<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gxxgle-it</title>
</head>

<body style="font-family: Arial">

<h2>Gxxgle-it</h2>

<input id="q" placeholder="輸入問題">
<button onclick="search()">搜尋</button>

<pre id="out">輸入關鍵字開始搜尋...</pre>

<script>
async function search() {
  const q = document.getElementById("q").value;
  const out = document.getElementById("out");

  if (!q) {
    out.innerText = "請輸入內容";
    return;
  }

  try {
    out.innerText = "搜尋中...";

    const res = await fetch(`/search?q=${encodeURIComponent(q)}`);

    if (!res.ok) {
      throw new Error("HTTP error: " + res.status);
    }

    const data = await res.json();

    out.innerText =
      "🧠 AI回答：\n" + (data.answer || "無") +
      "\n\nPTT：\n" + (data.ptt || []).join("\n") +
      "\n\nReddit：\n" + (data.reddit || []).join("\n");

  } catch (err) {
    console.error(err);
    out.innerText =
      "❌ 發生錯誤\n\n" + err.message;
  }
}
</script>

</body>
</html>
