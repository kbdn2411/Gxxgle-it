<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>超嚴謹搜尋器</title>

<style>
body {
    background: #0f0f0f;
    color: #00ffcc;
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}

h1 {
    font-size: 48px;
    margin-bottom: 30px;
}

input {
    width: 60%;
    padding: 16px;
    font-size: 20px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    padding: 16px 24px;
    font-size: 18px;
    margin-left: 10px;
    cursor: pointer;
}

pre {
    margin-top: 40px;
    white-space: pre-wrap;
    font-size: 18px;
    line-height: 1.6;
    text-align: left;
    display: inline-block;
    max-width: 80%;
}
</style>
</head>

<body>

<h1>超嚴謹搜尋器</h1>

<input id="q" placeholder="輸入問題...">
<button onclick="go()">搜尋</button>

<pre id="out"></pre>

<script>
async function go() {
    let q = document.getElementById("q").value;

    let res = await fetch(`/search?q=${encodeURIComponent(q)}`);
    let data = await res.json();

    document.getElementById("out").innerText =
`搜尋結果：約 ${data.results} 筆

可信度：${data.credibility}%

AI摘要：
${data.summary}

────────────────────

${data.answer}`;
}
</script>

</body>
</html>
